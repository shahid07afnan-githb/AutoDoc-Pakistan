<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="20" y1="14" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Outer shield / polygon container -->
  <polygon points="32,4 56,15 56,41 32,60 8,41 8,15" fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Subtle inner geometric frame -->
  <polygon points="32,8 52,18 52,39 32,55 12,39 12,18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Stylized Engine Piston & Connecting Rod / Spark Diagnostic Motif -->
  <!-- Piston Crown -->
  <rect x="22" y="16" width="20" height="9" rx="2" fill="url(#amberGrad)"/>
  <!-- Piston Rings -->
  <line x1="22" y1="19" x2="42" y2="19" stroke="#78350f" stroke-width="1"/>
  <line x1="22" y1="22" x2="42" y2="22" stroke="#78350f" stroke-width="1"/>

  <!-- Piston Wrist Pin / Center Circle -->
  <circle cx="32" cy="29" r="4.5" fill="url(#metalGrad)"/>
  <circle cx="32" cy="29" r="2" fill="#0f172a"/>

  <!-- Connecting Rod Angle / Diagnostic Spark Wrench -->
  <path d="M30 33 L26 47 L31 47 L33 43 L37 47 L38 47 L34 33 Z" fill="url(#metalGrad)"/>

  <!-- Dynamic Tachometer / Dual Wings (Cars & Bikes) -->
  <path d="M16 32 C16 23 23 18 30 17" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M48 32 C48 23 41 18 34 17" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small Diagnostic Pulse dot -->
  <circle cx="32" cy="50" r="2" fill="#f59e0b"/>
</svg>
